name: provider-credentialing

services:
  app:
    image: ghcr.io/pr14-cell/procred-app:${APP_VERSION:-1.0.2}
    restart: unless-stopped
    ports:
      - "${HOST_APP_BIND_IP:-127.0.0.1}:${HOST_APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
      migration:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: postgresql://credentialing_app:${DB_APP_PASSWORD:?DB_APP_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-credentialing}
      DATABASE_ADMIN_URL: postgresql://${POSTGRES_USER:-credentialing_admin}:${DB_ADMIN_PASSWORD:?DB_ADMIN_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-credentialing}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_USER:?MINIO_USER must be set}
      S3_SECRET_KEY: ${MINIO_PASSWORD:?MINIO_PASSWORD must be set}
      S3_BUCKET_CREDENTIALS: ${S3_BUCKET_CREDENTIALS:-credentials}
      S3_BUCKET_ENROLLMENTS: ${S3_BUCKET_ENROLLMENTS:-enrollments}
      S3_BUCKET_GENERAL: ${S3_BUCKET_GENERAL:-general}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set}
      ENCRYPTION_KEY_PREVIOUS: ${ENCRYPTION_KEY_PREVIOUS:-}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET must be set}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?NEXTAUTH_URL must be set}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      INITIAL_SETUP_TOKEN: ${INITIAL_SETUP_TOKEN:?INITIAL_SETUP_TOKEN must be set}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      MFA_MANDATORY: ${MFA_MANDATORY:-true}
      BACKUP_DIR: /app/backups
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST must be set}
      SMTP_PORT: ${SMTP_PORT:?SMTP_PORT must be set}
      SMTP_USER: ${SMTP_USER:?SMTP_USER must be set}
      SMTP_PASS: ${SMTP_PASS:?SMTP_PASS must be set}
      SMTP_FROM: ${SMTP_FROM:-noreply@credentialing.local}
    volumes:
      - backups_data:/app/backups
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    image: ghcr.io/pr14-cell/procred-app:${APP_VERSION:-1.0.2}
    command: ["node", "workers/runner.js"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
      migration:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://credentialing_app:${DB_APP_PASSWORD:?DB_APP_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-credentialing}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_USER:?MINIO_USER must be set}
      S3_SECRET_KEY: ${MINIO_PASSWORD:?MINIO_PASSWORD must be set}
      S3_BUCKET_CREDENTIALS: ${S3_BUCKET_CREDENTIALS:-credentials}
      S3_BUCKET_ENROLLMENTS: ${S3_BUCKET_ENROLLMENTS:-enrollments}
      S3_BUCKET_GENERAL: ${S3_BUCKET_GENERAL:-general}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set}
      ENCRYPTION_KEY_PREVIOUS: ${ENCRYPTION_KEY_PREVIOUS:-}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST must be set}
      SMTP_PORT: ${SMTP_PORT:?SMTP_PORT must be set}
      SMTP_USER: ${SMTP_USER:?SMTP_USER must be set}
      SMTP_PASS: ${SMTP_PASS:?SMTP_PASS must be set}
      SMTP_FROM: ${SMTP_FROM:-noreply@credentialing.local}
    networks:
      - backend
      - worker_egress
    healthcheck:
      test: ["CMD", "node", "-e", "const f=require('fs');const s=f.statSync('/tmp/worker-heartbeat');if(Date.now()-s.mtimeMs>30000)process.exit(1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-credentialing}
      POSTGRES_USER: ${POSTGRES_USER:-credentialing_admin}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?DB_ADMIN_PASSWORD must be set}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?DB_APP_PASSWORD must be set}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db/01-init-roles.sh:/docker-entrypoint-initdb.d/01-init-roles.sh:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-credentialing_admin} -d ${POSTGRES_DB:-credentialing}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:?MINIO_USER must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?MINIO_PASSWORD must be set}
    volumes:
      - miniodata:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "/usr/bin/minio", "--version"]
      interval: 10s
      timeout: 5s
      retries: 3

  migration:
    image: ghcr.io/pr14-cell/procred-migrations:${APP_VERSION:-1.0.2}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-credentialing_admin}:${DB_ADMIN_PASSWORD:?DB_ADMIN_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-credentialing}
    networks:
      - backend

networks:
  frontend:
  backend:
    internal: true
  worker_egress:

volumes:
  pgdata:
    name: provider_credentialing_pgdata
  redisdata:
    name: provider_credentialing_redisdata
  miniodata:
    name: provider_credentialing_miniodata
  backups_data:
    name: provider_credentialing_backups