name: Publish Docker images

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Image version tag
        required: true
        default: "1.0.2"
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync migration Prisma files
        run: |
          rm -rf migration/prisma
          mkdir -p migration/prisma
          cp -a prisma/. migration/prisma/

      - name: Generate app image tags
        id: app_meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/pr14-cell/procred-app
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and publish app and worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.app_meta.outputs.tags }}
          labels: ${{ steps.app_meta.outputs.labels }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Generate migration image tags
        id: migration_meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/pr14-cell/procred-migrations
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and publish migration image
        uses: docker/build-push-action@v6
        with:
          context: ./migration
          file: ./migration/Dockerfile
          push: true
          tags: ${{ steps.migration_meta.outputs.tags }}
          labels: ${{ steps.migration_meta.outputs.labels }}
          cache-from: type=gha,scope=migrations
          cache-to: type=gha,mode=max,scope=migrations