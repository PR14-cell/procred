# docker-compose.yml - Provider Credentialing & Payer Enrollment Management System
services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on:
      app:
        condition: service_healthy
    networks:
      - frontend
    # C6: Caddy health check via caddy version
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3

  app:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "3000"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://credentialing_app:${DB_APP_PASSWORD}@postgres:5432/credentialing
      DATABASE_ADMIN_URL: postgresql://credentialing_admin:${DB_ADMIN_PASSWORD}@postgres:5432/credentialing
      # C2: Redis URL includes password
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_USER}
      S3_SECRET_KEY: ${MINIO_PASSWORD}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Reverse proxy trust: enables getClientIp to read the first entry of X-Forwarded-For
      # when running behind Caddy, Nginx Proxy Manager, or TrueNAS reverse proxies
      TRUST_PROXY: ${TRUST_PROXY:-true}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
    networks:
      - frontend
      - backend
    # C6: App health check via dedicated API endpoint
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "workers/runner.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://credentialing_app:${DB_APP_PASSWORD}@postgres:5432/credentialing
      # C2: Redis URL includes password
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_USER}
      S3_SECRET_KEY: ${MINIO_PASSWORD}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
    networks:
      - backend
    # C6: Worker health check via file-based heartbeat
    healthcheck:
      test: ["CMD", "node", "-e", "const f=require('fs');const s=f.statSync('/tmp/worker-heartbeat');if(Date.now()-s.mtimeMs>30000)process.exit(1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  postgres:
    image: postgres:16-alpine
    # Bound to localhost only - not exposed directly to the public internet
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # C1: Init script creates separate app role with limited privileges and protects audit_logs
      - ./scripts/init-db-roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    environment:
      POSTGRES_DB: credentialing
      POSTGRES_USER: credentialing_admin
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD}
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credentialing_admin -d credentialing"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # Bound to localhost only - not exposed directly to the public internet
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    # Bound to localhost only - not exposed directly to the public internet
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    networks:
      - backend
    healthcheck:
      test: ["CMD", "/usr/bin/minio", "--version"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  frontend:
  backend:

volumes:
  pgdata:
  redisdata:
  miniodata:
  caddy_data:
